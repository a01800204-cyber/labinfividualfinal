name: DevSecOps security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit and security regression tests (pytest)
        run: python -m pytest -q
      - name: Static analysis (Bandit)
        if: success() || failure()
        run: python -m bandit -r src -q
      - name: Dependency audit (pip-audit)
        if: success() || failure()
        run: python -m pip_audit -r requirements-audit.txt
